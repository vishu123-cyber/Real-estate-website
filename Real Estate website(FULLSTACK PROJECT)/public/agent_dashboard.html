<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard - LuxeEstate</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        .sidebar {
            background: var(--dark);
            padding: 2rem;
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            height: fit-content;
        }

        .sidebar h3 {
            color: var(--text-heading);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .menu-item {
            display: block;
            padding: 1rem;
            color: var(--text);
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .menu-item:hover,
        .menu-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--secondary);
        }

        .menu-item i {
            margin-right: 0.8rem;
            width: 20px;
        }

        .content-area {
            background: var(--dark);
            padding: 2rem;
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            min-height: 80vh;
        }

        /* Listing Cards */
        .listing-card {
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
        }

        .listing-img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
        }

        .listing-info {
            flex: 1;
        }

        .listing-actions {
            display: flex;
            gap: 0.5rem;
            flex-direction: column;
            justify-content: center;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .delete-btn:hover {
            border-color: #ff4d4d;
            color: #ff4d4d;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--dark);
            padding: 2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        /* Inquiries */
        .inquiry-card {
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .inquiry-card:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">Luxe<span>Estate</span> Agent</div>
            <div>
                <span id="agent-name" style="margin-right: 1rem; color: var(--secondary);">Agent</span>
                <button id="logout-btn" class="btn" style="padding: 0.5rem 1rem;">Logout</button>
            </div>
        </nav>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <h3>Menu</h3>
            <div class="menu-item active" data-tab="listings">
                <i class="fas fa-home"></i> My Listings
            </div>
            <div class="menu-item" data-tab="inquiries">
                <i class="fas fa-envelope"></i> Inquiries
            </div>
            <div class="menu-item" id="add-property-btn">
                <i class="fas fa-plus"></i> Add New Property
            </div>
        </aside>

        <main class="content-area">
            <!-- Listings View -->
            <div id="listings-view">
                <h2 style="margin-bottom: 2rem;">My Properties</h2>
                <div id="listings-list">
                    <!-- Injected via JS -->
                    <div style="text-align: center; color: #777; padding: 2rem;">Loading listings...</div>
                </div>
            </div>

            <!-- Inquiries View -->
            <div id="inquiries-view" style="display: none;">
                <h2 style="margin-bottom: 2rem;">Recent Inquiries</h2>
                <div id="inquiries-list">
                    <!-- Injected via JS -->
                    <div style="text-align: center; color: #777; padding: 2rem;">Loading inquiries...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Property Modal -->
    <div id="property-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 1.5rem;">Add New Property</h2>
            <form id="property-form">
                <input type="hidden" id="edit-id">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Title</label>
                        <input type="text" id="prop-title" required>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="prop-type" required>
                            <option value="Apartment">Apartment</option>
                            <option value="House">House</option>
                            <option value="Villa">Villa</option>
                            <option value="Condo">Condo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price (₹)</label>
                        <input type="number" id="prop-price" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Location</label>
                        <input type="text" id="prop-location" required>
                    </div>
                    <div class="form-group">
                        <label>Bedrooms</label>
                        <input type="number" id="prop-beds" placeholder="e.g. 3">
                    </div>
                    <div class="form-group">
                        <label>Bathrooms</label>
                        <input type="number" id="prop-baths" placeholder="e.g. 2">
                    </div>
                    <div class="form-group full-width">
                        <label>Property Images (Select up to 10)</label>
                        <div id="file-input-group">
                            <input type="file" id="prop-file" name="images" accept="image/*" multiple required>
                        </div>
                        <div id="img-preview-container"
                            style="margin-top: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; display: none;">
                            <!-- Previews will be injected here -->
                        </div>
                        <p id="img-error" style="color: #ff4d4d; font-size: 0.85rem; margin-top: 5px; display: none;">
                            <i class="fas fa-exclamation-circle"></i> Invalid image file(s).
                        </p>
                    </div>
                    <div class="form-group full-width">
                        <label>Description</label>
                        <textarea id="prop-desc" rows="4" required></textarea>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" id="cancel-modal" style="flex: 1;">Cancel</button>
                    <button type="submit" class="btn btn-fill" style="flex: 1;">Save Property</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('agentToken');
        if (!token) window.location.href = '/agent-login.html';

        document.getElementById('agent-name').textContent = localStorage.getItem('agentName') || 'Agent';

        // Tabs
        const tabs = document.querySelectorAll('.menu-item[data-tab]');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.menu-item').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                const view = tab.dataset.tab;
                document.getElementById('listings-view').style.display = view === 'listings' ? 'block' : 'none';
                document.getElementById('inquiries-view').style.display = view === 'inquiries' ? 'block' : 'none';

                if (view === 'listings') loadListings();
                if (view === 'inquiries') loadInquiries();
            });
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('agentToken');
            localStorage.removeItem('agentName');
            window.location.href = '/agent-login.html';
        });

        // Load Listings
        async function loadListings() {
            try {
                const res = await fetch('/api/agent/properties', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const props = await res.json();
                const container = document.getElementById('listings-list');

                if (props.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #777; padding: 2rem;">No properties found. Add your first listing!</div>';
                    return;
                }

                container.innerHTML = props.map(p => `
                    <div class="listing-card">
                        <img src="${p.image || 'https://via.placeholder.com/150'}" class="listing-img" alt="${p.title}">
                        <div class="listing-info">
                            <h4 style="color: white; margin-bottom: 0.5rem; font-size: 1.1rem;">${p.title}</h4>
                            <p style="color: var(--secondary); margin-bottom: 0.5rem;">₹${p.price?.toLocaleString('en-IN')}</p>
                            <p style="color: #aaa; font-size: 0.9rem;">${p.location}</p>
                        </div>
                        <div class="listing-actions">
                            <button class="action-btn" onclick="editProperty('${p._id}')"><i class="fas fa-edit"></i> Edit</button>
                            <button class="action-btn delete-btn" onclick="deleteProperty('${p._id}')"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        // Load Inquiries
        async function loadInquiries() {
            try {
                const res = await fetch('/api/agent/messages', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const msgs = await res.json();
                const container = document.getElementById('inquiries-list');

                if (msgs.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #777; padding: 2rem;">No inquiries yet.</div>';
                    return;
                }

                container.innerHTML = msgs.map(m => `
                    <div class="inquiry-card">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <h4 style="color: white;">${m.name}</h4>
                            <span style="color: #666; font-size: 0.8rem;">${new Date(m.timestamp).toLocaleDateString()}</span>
                        </div>
                        <p style="color: var(--secondary); font-size: 0.9rem; margin-bottom: 0.5rem;">Re: ${m.propertyId?.title || 'Unknown Property'}</p>
                        <p style="color: #ccc; margin-bottom: 0.5rem;">"${m.message}"</p>
                        <a href="mailto:${m.email}" style="color: var(--secondary); font-size: 0.9rem;">Reply to ${m.email}</a>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        // Modal Logic
        const modal = document.getElementById('property-modal');
        const form = document.getElementById('property-form');

        document.getElementById('add-property-btn').addEventListener('click', () => {
            document.getElementById('modal-title').textContent = 'Add New Property';
            document.getElementById('edit-id').value = '';
            form.reset();
            document.getElementById('img-preview-container').style.display = 'none'; // Hide preview
            document.getElementById('prop-file').setAttribute('required', 'true'); // Require image for new
            modal.style.display = 'flex';
        });

        document.getElementById('cancel-modal').addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.onclick = (e) => {
            if (e.target == modal) modal.style.display = 'none';
        }

        // Save Property (Add/Edit)
        // Save Property (Add/Edit)
        // Save Property (Add/Edit)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/properties/${id}` : '/api/properties';

            const formData = new FormData();
            formData.append('title', document.getElementById('prop-title').value);
            formData.append('type', document.getElementById('prop-type').value);
            formData.append('price', document.getElementById('prop-price').value);
            formData.append('location', document.getElementById('prop-location').value);
            formData.append('description', document.getElementById('prop-desc').value);
            const beds = document.getElementById('prop-beds').value;
            if (beds) formData.append('beds', beds);
            const baths = document.getElementById('prop-baths').value;
            if (baths) formData.append('baths', baths);

            // Handle Images - Multiple Files
            const fileInput = document.getElementById('prop-file');
            if (fileInput.files.length > 0) {
                for (let i = 0; i < fileInput.files.length; i++) {
                    formData.append('images', fileInput.files[i]);
                }
            } else if (method === 'POST') {
                alert("Please select at least one image file.");
                return;
            }

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${token}`
                        // Content-Type: multipart/form-data is set automatically by fetch
                    },
                    body: formData
                });

                if (res.ok) {
                    modal.style.display = 'none';
                    loadListings();
                } else {
                    const errData = await res.json();
                    const errorMsg = errData.error && typeof errData.error === 'object' ? JSON.stringify(errData.error) : (errData.error || 'Unknown error');
                    alert('Failed to save property: ' + errorMsg);
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred while saving.');
            }
        });



        // File Preview for Multiple Images
        document.getElementById('prop-file').addEventListener('change', function () {
            const container = document.getElementById('img-preview-container');
            container.innerHTML = '';
            container.style.display = 'grid';
            document.getElementById('img-error').style.display = 'none';

            if (this.files.length > 0) {
                Array.from(this.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.style.width = '100%';
                        img.style.height = '100px';
                        img.style.objectFit = 'cover';
                        img.style.borderRadius = 'var(--radius-sm)';
                        img.style.border = '1px solid var(--glass-border)';
                        container.appendChild(img);
                    }
                    reader.readAsDataURL(file);
                });
            } else {
                container.style.display = 'none';
            }
        });

        // Delete Property
        async function deleteProperty(id) {
            if (!confirm('Are you sure you want to delete this listing?')) return;

            try {
                const res = await fetch(`/api/properties/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) loadListings();
            } catch (err) {
                console.error(err);
            }
        }

        // Edit Property (Populate Form)
        // Edit Property (Populate Form)
        window.editProperty = async (id) => {
            try {
                const res = await fetch(`/api/properties/${id}`);
                const prop = await res.json();

                document.getElementById('modal-title').textContent = 'Edit Property';
                document.getElementById('edit-id').value = prop._id;
                document.getElementById('prop-title').value = prop.title;
                document.getElementById('prop-type').value = prop.type;
                document.getElementById('prop-price').value = prop.price;
                document.getElementById('prop-location').value = prop.location;
                // Note: File input cannot be set programmatically for security reasons.
                // We show the current image in preview instead.
                document.getElementById('prop-desc').value = prop.description;
                document.getElementById('prop-beds').value = prop.beds || '';
                document.getElementById('prop-baths').value = prop.baths || '';

                // Show existing images
                const container = document.getElementById('img-preview-container');
                container.innerHTML = '';

                const allImages = prop.images && prop.images.length > 0 ? prop.images : (prop.image ? [prop.image] : []);

                if (allImages.length > 0) {
                    container.style.display = 'grid';
                    allImages.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.style.width = '100%';
                        img.style.height = '100px';
                        img.style.objectFit = 'cover';
                        img.style.borderRadius = 'var(--radius-sm)';
                        img.style.border = '1px solid var(--glass-border)';
                        container.appendChild(img);
                    });
                }

                // Remove required attribute from file input since we have an existing image
                document.getElementById('prop-file').removeAttribute('required');

                modal.style.display = 'flex';
            } catch (err) {
                console.error(err);
                alert('Failed to load property details.');
            }
        };



        // Init
        loadListings();
    </script>
</body>

</html>
