<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#081a2e">
    <meta http-equiv="refresh" content="0;url=/agent-dashboard.html">
    <title>Agent Dashboard - LuxeEstate</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-redirect {
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 1.5rem;
            background:
                radial-gradient(circle at 10% 10%, rgba(75, 141, 190, 0.32), transparent 26rem),
                radial-gradient(circle at 88% 90%, rgba(74, 211, 185, 0.16), transparent 25rem),
                #07182a;
        }

        .dashboard-redirect-card {
            width: min(100%, 28rem);
            padding: 2rem;
            border: 1px solid rgba(190, 222, 240, 0.17);
            border-radius: 1.15rem;
            background: linear-gradient(145deg, rgba(20, 51, 80, 0.92), rgba(8, 28, 49, 0.96));
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.25);
            color: #9eb2c5;
            text-align: center;
        }

        .dashboard-redirect-mark {
            display: grid;
            width: 2.7rem;
            height: 2.7rem;
            place-items: center;
            margin: 0 auto 1rem;
            border: 1px solid rgba(121, 236, 215, 0.55);
            border-radius: 0.8rem;
            background: rgba(121, 236, 215, 0.1);
            color: #79ecd7;
            font: 800 0.83rem/1 Inter, sans-serif;
            letter-spacing: -0.06em;
        }

        .dashboard-redirect-card h1 {
            margin: 0;
            color: #eff7ff;
            font-family: Inter, sans-serif;
            font-size: 1.4rem;
            letter-spacing: -0.04em;
        }

        .dashboard-redirect-card p {
            margin: 0.65rem 0 1.2rem;
            font-size: 0.9rem;
        }

        .dashboard-redirect-card a {
            color: #79ecd7;
            font-size: 0.88rem;
            font-weight: 700;
        }

        .dashboard-redirect-card a:hover,
        .dashboard-redirect-card a:focus-visible {
            color: #b5fbed;
            outline: none;
            text-decoration: underline;
        }
    </style>
</head>

<body class="dashboard-redirect">
    <main class="dashboard-redirect-card">
        <div class="dashboard-redirect-mark" aria-hidden="true">LE</div>
        <h1>Opening your workspace</h1>
        <p>The agent dashboard has moved to a new address.</p>
        <a href="/agent-dashboard.html">Open the agent dashboard</a>
    </main>
</body>

</html>
