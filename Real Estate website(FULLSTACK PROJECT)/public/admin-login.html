<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - LuxeEstate</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="auth-container">
        <div class="glass-panel auth-box">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--secondary);">Admin Login</h2>
                <p style="color: var(--text);">Please sign in to continue</p>
            </div>
            <form id="login-form">
                <div style="margin-bottom: 1.5rem;">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-fill" style="width: 100%; justify-content: center;">Login</button>
                <p id="error-msg" style="color: #ff6b6b; text-align: center; margin-top: 1rem; display: none;"></p>
            </form>
            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="/" style="color: var(--text); font-size: 0.9rem;">&larr; Back to Home</a>
            </div>
        </div>
    </div>
    <script src="js/admin.js"></script>
</body>

</html>
