<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#081a2e">
    <title>Admin Login - LuxeEstate</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        .portal-auth {
            --auth-ink: #eff7ff;
            --auth-muted: #9eb2c5;
            --auth-accent: #79ecd7;
            --auth-line: rgba(188, 220, 240, 0.17);
            min-height: 100vh;
            background:
                radial-gradient(circle at 7% 10%, rgba(88, 144, 196, 0.36), transparent 28rem),
                radial-gradient(circle at 92% 94%, rgba(55, 207, 177, 0.18), transparent 27rem),
                #07182a;
            color: var(--auth-muted);
        }

        .portal-auth .auth-container {
            position: relative;
            display: grid;
            min-height: 100vh;
            padding: clamp(1.1rem, 4vw, 3.5rem);
            background: none;
            overflow: hidden;
        }

        .portal-auth .auth-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.34;
            background-image: linear-gradient(rgba(194, 225, 242, 0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(194, 225, 242, 0.045) 1px, transparent 1px);
            background-size: 38px 38px;
            mask-image: linear-gradient(135deg, black, transparent 76%);
        }

        .portal-auth .auth-layout {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(0, 0.92fr) minmax(20rem, 0.78fr);
            align-items: center;
            gap: clamp(2rem, 7vw, 7rem);
            width: min(100%, 1090px);
            margin: auto;
        }

        .portal-auth .auth-story {
            max-width: 34rem;
            padding: 1rem 0;
        }

        .portal-auth .brand-link {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: clamp(3.5rem, 9vh, 6rem);
            color: var(--auth-ink);
            font-family: Inter, sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .portal-auth .brand-link:hover,
        .portal-auth .brand-link:focus-visible {
            color: var(--auth-accent);
            outline: none;
        }

        .portal-auth .brand-symbol {
            display: grid;
            width: 2.2rem;
            height: 2.2rem;
            place-items: center;
            border: 1px solid rgba(121, 236, 215, 0.62);
            border-radius: 0.72rem;
            background: rgba(121, 236, 215, 0.1);
            color: var(--auth-accent);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: -0.06em;
        }

        .portal-auth .brand-link span {
            color: var(--auth-accent);
        }

        .portal-auth .auth-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin: 0 0 1rem;
            color: var(--auth-accent);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .portal-auth .auth-kicker::before {
            width: 1.75rem;
            height: 1px;
            background: currentColor;
            content: "";
        }

        .portal-auth .auth-story h1 {
            max-width: 10ch;
            margin: 0;
            color: var(--auth-ink);
            font-family: Inter, sans-serif;
            font-size: clamp(2.35rem, 5vw, 4.35rem);
            font-weight: 700;
            letter-spacing: -0.07em;
            line-height: 0.98;
        }

        .portal-auth .auth-story > p:last-child {
            max-width: 28rem;
            margin: 1.45rem 0 0;
            color: var(--auth-muted);
            font-size: clamp(0.95rem, 1.3vw, 1.07rem);
            line-height: 1.75;
        }

        .portal-auth .auth-box {
            width: 100%;
            max-width: none;
            padding: clamp(1.45rem, 3.5vw, 2.35rem);
            border: 1px solid var(--auth-line);
            border-radius: 1.25rem;
            background: linear-gradient(145deg, rgba(22, 53, 82, 0.9), rgba(9, 29, 50, 0.94));
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .portal-auth .auth-panel-header {
            margin-bottom: 1.8rem;
        }

        .portal-auth .auth-panel-header .auth-kicker {
            margin-bottom: 0.75rem;
            font-size: 0.67rem;
        }

        .portal-auth .auth-panel-header h2 {
            margin: 0;
            color: var(--auth-ink);
            font-family: Inter, sans-serif;
            font-size: clamp(1.45rem, 2.4vw, 1.8rem);
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        .portal-auth .auth-panel-header p {
            margin: 0.5rem 0 0;
            color: var(--auth-muted);
            font-size: 0.92rem;
        }

        .portal-auth .auth-field {
            margin-bottom: 1.1rem;
        }

        .portal-auth .auth-field label {
            display: block;
            margin: 0 0 0.48rem;
            color: #c9d8e7;
            font-size: 0.79rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .portal-auth .auth-field input {
            width: 100%;
            min-height: 3.05rem;
            padding: 0.75rem 0.9rem;
            border: 1px solid var(--auth-line);
            border-radius: 0.7rem;
            background: rgba(2, 18, 34, 0.34);
            color: var(--auth-ink);
            font-family: Inter, sans-serif;
            font-size: 0.93rem;
            transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        .portal-auth .auth-field input::placeholder {
            color: #6f879d;
        }

        .portal-auth .auth-field input:hover {
            border-color: rgba(177, 216, 239, 0.3);
        }

        .portal-auth .auth-field input:focus {
            border-color: var(--auth-accent);
            background: rgba(2, 18, 34, 0.6);
            box-shadow: 0 0 0 3px rgba(121, 236, 215, 0.12);
            outline: none;
        }

        .portal-auth .auth-box .btn {
            display: flex;
            width: 100%;
            min-height: 3.05rem;
            align-items: center;
            justify-content: center;
            margin-top: 1.45rem;
            padding: 0.75rem 1rem;
            border: 1px solid #79ecd7;
            border-radius: 0.72rem;
            background: linear-gradient(135deg, #86efdc, #4cd1ba);
            color: #052238;
            font-family: Inter, sans-serif;
            font-size: 0.84rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
        }

        .portal-auth .auth-box .btn:hover,
        .portal-auth .auth-box .btn:focus-visible {
            background: linear-gradient(135deg, #9cf7e5, #59dac2);
            box-shadow: 0 10px 24px rgba(75, 207, 183, 0.2);
            outline: none;
            transform: translateY(-2px);
        }

        .portal-auth .auth-box .btn:disabled {
            cursor: wait;
            opacity: 0.7;
            transform: none;
        }

        .portal-auth #error-msg {
            min-height: 1.25rem;
            margin: 0.95rem 0 0;
            color: #ffb4b4;
            font-size: 0.84rem;
            line-height: 1.45;
            text-align: center;
        }

        .portal-auth .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-top: 1.4rem;
            color: var(--auth-muted);
            font-size: 0.84rem;
        }

        .portal-auth .back-link:hover,
        .portal-auth .back-link:focus-visible {
            color: var(--auth-accent);
            outline: none;
        }

        .portal-auth .back-link::before {
            content: "←";
            transition: transform 180ms ease;
        }

        .portal-auth .back-link:hover::before {
            transform: translateX(-3px);
        }

        .portal-auth .auth-panel-footer {
            margin-top: 1.3rem;
            padding-top: 1.3rem;
            border-top: 1px solid var(--auth-line);
            text-align: center;
        }

        @media (max-width: 760px) {
            .portal-auth .auth-layout {
                display: block;
                width: min(100%, 30rem);
            }

            .portal-auth .auth-story {
                display: none;
            }

            .portal-auth .auth-box {
                padding: 1.45rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .portal-auth *,
            .portal-auth *::before,
            .portal-auth *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="portal-auth">
    <main class="auth-container">
        <div class="auth-layout">
            <section class="auth-story" aria-label="LuxeEstate administrator access">
                <a class="brand-link" href="/" aria-label="Return to LuxeEstate home">
                    <span class="brand-symbol" aria-hidden="true">LE</span>
                    <span>Luxe<span>Estate</span></span>
                </a>
                <p class="auth-kicker">Administrator access</p>
                <h1>Clarity for every decision.</h1>
                <p>Manage the marketplace with a secure view of properties, agent approvals, and customer conversations.</p>
            </section>

            <section class="glass-panel auth-box" aria-labelledby="login-title">
                <div class="auth-panel-header">
                    <p class="auth-kicker">Secure workspace</p>
                    <h2 id="login-title">Welcome back</h2>
                    <p>Sign in to continue to the administrator portal.</p>
                </div>
                <form id="login-form">
                    <div class="auth-field">
                        <label for="username">Username</label>
                        <input type="text" id="username" autocomplete="username" placeholder="Enter your username" required>
                    </div>
                    <div class="auth-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-fill">Sign in securely</button>
                    <p id="error-msg" aria-live="polite" style="display: none;"></p>
                </form>
                <div class="auth-panel-footer">
                    <a class="back-link" href="/">Back to LuxeEstate</a>
                </div>
            </section>
        </div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/admin-portal.js"></script>
</body>

</html>
